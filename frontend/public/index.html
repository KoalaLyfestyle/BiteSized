<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiteSized: small recipes, tagged and easy to find</title>
    <meta
      name="description"
      content="BiteSized is a small recipe board. Browse recipes, filter them by tag, and post your own."
    />
    <meta name="theme-color" content="#FBF5EC" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Social previews. Crawlers need an absolute image URL: set PUBLIC_URL to the
         deployed origin at build time (for example PUBLIC_URL=https://example.com). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BiteSized" />
    <meta property="og:title" content="BiteSized: small recipes, tagged and easy to find" />
    <meta
      property="og:description"
      content="Browse recipes, filter them by tag, and post your own."
    />
    <meta property="og:image" content="%PUBLIC_URL%/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The BiteSized cookie logo next to the line: Small recipes, tagged and easy to find." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>BiteSized needs JavaScript to show recipes.</noscript>
    <div id="root"></div>
  </body>
</html>
